[package]
name = "drawpaper"
version = "0.1.0-rc.27"
description = "drawpaper — local-first infinite-canvas knowledge-block note tool (Windows desktop shell)"
edition = "2021"
rust-version = "1.77"
authors = ["drawpaper contributors"]
license = "MIT"

# The library crate is where Tauri 2 apps put app logic; main.rs just calls lib::run().
[lib]
name = "drawpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"
# Single-instance plugin: prevents two Windows processes when user double-clicks
# a second .kbnote file while the app is already running; forwards the argv path
# to the running instance via the `second-instance` event.
tauri-plugin-single-instance = "2.0"
# Native notifications for save success/failure/migration hints. On Windows
# this posts to the Action Center; the web side falls back to toast in browsers.
tauri-plugin-notification = "2.0"
# Wave13: remember window position / size / maximized state across restarts.
# Pure Rust-side (no JS commands, no extra capabilities). Restored geometry is
# clamped to tauri.conf minWidth/minHeight (960x600).
tauri-plugin-window-state = "2.0"
# Wave13: structured logging to drawpaper.log (app log dir) + stdout + webview
# forward. Replaces env_logger as the global `log` logger; level=Info.
tauri-plugin-log = "2.0"
# Wave17: desktop GLOBAL shortcuts (work even when the window is unfocused).
# Rust-side only: accelerators are resolved against the existing native menu
# ids and dispatched through the SAME `app:menu` event channel as menu clicks,
# so no new business logic lives here. User-overridable via
# drawpaper-shortcuts.json in the app config dir; every failure path warns and
# falls back instead of panicking or blocking startup.
tauri-plugin-global-shortcut = "2"
# Wave15 A: official Tauri updater (manual-only). The native "帮助→检查更新…"
# flow calls Updater.check() ONCE on user click; no startup/timer/poll. When a
# newer signed release is found we show a confirm dialog, then
# download_and_install + restart; on no-update / offline / missing-endpoint /
# any error we transparently fall back to opening the Releases web page (the
# Wave13 behavior). The pubkey lives in tauri.conf plugins.updater.pubkey; the
# matching private key is a GitHub secret (TAURI_SIGNING_KEY), never in-repo.
tauri-plugin-updater = "2"
# Wave13: decode the base64 export bytes (PDF/PNG/SVG/MD) passed by the frontend
# through the `save_export` command.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dialog commands await the native picker via a oneshot channel. (tokio is
# already in the dependency tree via tauri itself; we just need the `sync`
# feature surface in our crate.)
tokio = { version = "1", features = ["sync"] }
# Recents list / auto-save folder metadata lives in a small JSON file next to
# the app config dir; no extra KV store dependency.
dirs = "5"
log = "0.4"
# Wave15 C: pure-Rust diagnostic bundle (help → 导出诊断信息 / `--diag-export`).
# zip writes the archive in Rust (no web dep). WebView2/OS version detection shells
# out to the system `reg.exe query` (std::process::Command) — no winreg dependency.
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# This feature is used for production builds where `devPath` points to the filesystem
# and the embed resources sidecar is unnecessary.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
